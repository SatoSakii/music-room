name: CI-Backend

on:
  push:
    branches: [main, init/project-setup]
    paths: [backend/**, .github/workflows/ci-backend.yml]
  pull_request:
    paths: [backend/**, .github/workflows/ci-backend.yml]

permissions:
  contents: read
  pull-requests: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx eslint "{src,test}/**/*.ts"
      - run: npm run build
